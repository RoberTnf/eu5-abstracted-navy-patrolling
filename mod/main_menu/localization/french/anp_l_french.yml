l_french:
 anp_patrol: "Abstracted Patrol"
 anp_patrol_desc: "Our fleet joins an abstracted patrol: every patrolling fleet pools the [maritime_presence|e] of its ships (each ship counts with its own maritime presence, as in vanilla), and the pool is spread evenly over all the sea zones we patrol (tick the box in a sea zone's window, or use the $anp_patrol_coastal_waters.title$ decision), raising our [maritime_presence|e] there each month. More and better ships mean stronger presence; more patrolled zones spread it thinner. With no patrolled zones the fleet covers every sea zone of its own sea [area|e] instead. Only works while the fleet is at sea and not in combat."
 anp_patrol_cta: "Click to patrol the seas."
 STATIC_MODIFIER_NAME_anp_patrolling: "Patrolling"
 STATIC_MODIFIER_DESC_anp_patrolling: "This fleet adds its ships to the pool spreading [maritime_presence|e] over our patrolled sea zones every month."
 ANP_PATROL_ZONE_TT: "#T Abstracted Navy Patrolling#!\nPatrol this sea zone: our fleets using Abstracted Patrol share their [maritime_presence|e] among all our patrolled zones. Click again to stop patrolling it.\n\nLast month each patrolled zone got #V +[GetPlayer.MakeScope.GetVariable('anp_zone_presence').GetValue|2]#! [maritime_presence|e]."
 anp_patrol_coastal_waters.title: "Patrol Our Coastal Waters"
 anp_patrol_coastal_waters.desc: "Patrol every sea zone that borders one of our [locations|e]. Fleets using Abstracted Patrol will share their [maritime_presence|e] among them, along with any zones already patrolled."
 anp_patrol_coastal_waters.a: "Patrol them"
 anp_stop_all_patrols.title: "Release All Patrolled Waters"
 anp_stop_all_patrols.desc: "Stop patrolling every sea zone. Fleets using Abstracted Patrol go back to covering their own sea [area|e]."
 anp_stop_all_patrols.a: "Release them"
 STATIC_MODIFIER_NAME_anp_patrolled_waters: "Patrolled Waters"
 STATIC_MODIFIER_DESC_anp_patrolled_waters: "Our patrolling fleets add this much [maritime_presence|e] here every month. It is added directly, so it does not show in the monthly breakdown."
